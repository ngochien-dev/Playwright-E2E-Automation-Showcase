version: '3.8'

services:
  # Mock Target Web Application
  web-app:
    build: .
    container_name: autotest-target-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Playwright Test Runner Service
  playwright-tests:
    image: mcr.microsoft.com/playwright:v1.44.1-jammy
    container_name: playwright-runner
    depends_on:
      web-app:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    environment:
      - CI=true
    # Run npm install to get dev dependencies, then run tests targeting the web-app container
    command: >
      sh -c "npm install && npx playwright test"
